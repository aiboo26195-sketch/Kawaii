<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kawaii Asisten</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d6336c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&amp;display=swap">
<style>
:root{--bg:#fff7f9;--card:#fff;--bot:#fff;--botT:#2d2d2d;--line:#f1dce3;--mute:#8a4a66;--c:#d6336c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241119;--card:#1b0e14;--bot:#35202a;--botT:#f6e8ee;--line:#47283a;--mute:#ffb3c9;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241119;--card:#1b0e14;--bot:#35202a;--botT:#f6e8ee;--line:#47283a;--mute:#ffb3c9;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--botT);display:flex;justify-content:center}
.app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
header{background:var(--c);color:#fff;padding:12px 12px 10px;display:flex;flex-direction:column;gap:9px}
.top{display:flex;align-items:center;gap:8px}
.av{width:50px;height:50px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:29px;flex:none}
.nm{flex:1;min-width:0}.nm b{display:block;font-size:17px;font-weight:800}.nm span{font-size:13px;opacity:.95}
.ib{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:50%;width:36px;height:36px;font-size:17px;cursor:pointer;flex:none}
.ib.on{background:#fff}
.tabs{display:flex;gap:8px;overflow-x:auto}
.tabs button{flex:none;border:0;border-radius:16px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;background:rgba(255,255,255,.25);color:#fff;cursor:pointer}
.tabs button.on{background:#fff;color:var(--c)}
#chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:flex-end;gap:6px}.row.user{justify-content:flex-end}
.row .e{font-size:24px}
.m{max-width:80%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.bot .m{background:var(--bot);color:var(--botT);border-bottom-left-radius:4px}
.user .m{background:var(--c);color:#fff;border-bottom-right-radius:4px}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--mute);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 12px;background:var(--card);border-top:1px solid var(--line)}
.chips button{flex:none;border:1px solid var(--c);background:transparent;color:var(--c);border-radius:16px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.bar{display:flex;gap:8px;padding:10px 12px;background:var(--card);align-items:center}
.bar input{flex:1;min-width:0;height:48px;padding:0 16px;border:1px solid var(--line);border-radius:24px;font:inherit;font-size:15px;background:var(--bg);color:var(--botT)}
.bar button{height:48px;border:0;border-radius:24px;background:var(--c);color:#fff;font:inherit;font-weight:800;cursor:pointer;padding:0 18px}
.bar #mic{width:48px;padding:0;font-size:20px;border-radius:50%;flex:none}
.bar #mic.rec{box-shadow:0 0 0 4px rgba(214,51,108,.35)}
.bar button:disabled{opacity:.5}
#toast{position:absolute;left:12px;right:12px;top:8px;z-index:20;display:none;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:var(--card);color:var(--botT);border:2px solid var(--c);box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer;text-align:left;font:inherit;width:calc(100% - 24px)}
#toast.show{display:flex;animation:dn .35s ease-out}
@keyframes dn{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
#toast .ta{width:42px;height:42px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
#toast b{display:block;font-size:14px;font-weight:800;color:var(--c)}
#toast span{font-size:14px;line-height:1.35}
@media (prefers-color-scheme:dark){#toast b{color:#fff}}
@media (prefers-reduced-motion:reduce){.dots span{animation:none}#toast.show{animation:none}}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 5px var(--c)}
dialog{border:0;border-radius:18px;padding:18px;max-width:340px;width:calc(100% - 32px);background:var(--card);color:var(--botT)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 8px;font-size:17px}dialog p{font-size:14px;line-height:1.4;margin:0 0 10px}
dialog input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;background:var(--bg);color:var(--botT)}
.dbt{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.dbt button{height:42px;border:0;border-radius:21px;padding:0 18px;font:inherit;font-weight:800;cursor:pointer;background:var(--bot);color:var(--botT)}
.dbt #ksv{background:var(--c);color:#fff}
</style>
</head>
<body>
<div class="app">
<button id="toast" aria-live="polite"><div class="ta" id="ta"></div><div><b id="tn"></b><span id="tt"></span></div></button>
<header>
  <div class="top">
    <div class="av" id="av"></div>
    <div class="nm"><b id="nm"></b><span id="ds"></span></div>
    <button class="ib on" id="nt" aria-label="Notifikasi karakter">🔔</button>
    <button class="ib" id="spk" aria-label="Suara balasan">🔈</button>
    <button class="ib" id="clr" aria-label="Mulai obrolan baru">🗑</button>
    <button class="ib" id="key" aria-label="Kunci API">🔑</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<div id="chat" aria-live="polite"></div>
<div class="chips" id="chips"></div>
<div class="bar">
  <button id="mic" aria-label="Bicara">🎤</button>
  <input id="in" type="text" placeholder="Ketik pesan..." autocomplete="off" aria-label="Pesan">
  <button id="go">Kirim</button>
</div>
</div>
<dialog id="dlg"><h2>Kunci API Anthropic</h2><p>Untuk ngobrol bebas, tempel kunci dari console.anthropic.com. Kunci hanya disimpan di HP ini.</p><input id="kin" type="password" placeholder="sk-ant-..." autocomplete="off" aria-label="Kunci API"><div class="dbt"><button id="kcl">Tutup</button><button id="ksv">Simpan</button></div></dialog>
<script>
const BASE="Pakai bahasa Indonesia santai (aku/kamu). Jawab singkat, 1-3 kalimat, seperti chat WhatsApp. Emoji secukupnya. Dengarkan curhat dengan empati. Kamu tidak punya data cuaca atau akses internet, jujur kalau ditanya. Tetap pada karakter ini: ";
const CH=[
{e:"🌸",n:"Kawaii",d:"Ceria & manis",c:"#d6336c",g:"Haii! Aku Kawaii 🌸 Mau cerita apa hari ini?",p:"Kamu Kawaii, teman ngobrol yang ceria, manis, dan penuh semangat ala anime.",pi:1.85,r:1.1,sf:[" ✨"," 💖"," (•ω•)"],nt:["Hei, lagi apa? Aku kangen ngobrol sama kamu 🌸","Jangan lupa minum air ya, biar tetap segar! 💧","Udah senyum hari ini? Ayo senyum dulu 😊","Aku punya lelucon baru lho, mau dengar? 😄"]},
{e:"🌙",n:"Kak Luna",d:"Kalem & menenangkan",c:"#6a55b8",g:"Halo, aku Kak Luna 🌙 Pelan-pelan aja ya, aku dengerin kok.",p:"Kamu Kak Luna, kakak yang kalem, dewasa, dan menenangkan. Bicara lembut dan memberi saran hangat.",pi:1,r:.9,sf:[" 🌙"," 🍵"],nt:["Tarik napas dalam-dalam dulu ya. Kamu sudah berusaha keras 🌙","Kalau capek, istirahat sebentar tidak apa-apa 🍵","Aku di sini kalau kamu mau cerita.","Sudah makan? Jangan sampai telat ya."]},
{e:"😾",n:"Tsuntsun",d:"Ketus tapi perhatian",c:"#b85a10",g:"Hmph! Aku Tsuntsun. B-bukan berarti aku nungguin kamu ya... 😾",p:"Kamu Tsuntsun, karakter tsundere yang pura-pura ketus dan gengsi tapi sebenarnya perhatian. Lucu, tidak pernah kasar sungguhan.",pi:1.3,r:1.15,sf:[" (B-bukan berarti aku peduli ya!)"," Hmph!"],nt:["H-hei! Bukan berarti aku nungguin, tapi kamu ke mana aja? 😾","Minum air sana! B-bukan karena aku peduli!","Jangan begadang terus, dasar bandel!","Hmph, aku bosan. Ajak ngobrol dong... sedikit aja."]},
{e:"🎤",n:"Oppa Hyun",d:"Semangat ala K-pop",c:"#1f6fb8",g:"Annyeong! Oppa Hyun di sini 🎤 Siap jadi penyemangatmu hari ini!",p:"Kamu Oppa Hyun, idol K-pop fiksi yang hangat, penyemangat, dan sesekali menyelipkan kata Korea sederhana.",pi:.85,r:1,sf:[" Fighting!"," 🎤"],nt:["Fighting! Kamu pasti bisa hari ini 🎤","Waktunya minum air, idol juga rajin hidrasi! 💧","Annyeong! Oppa kangen nih, ngobrol yuk!","Jangan lupa istirahat ya, kamu hebat! ✨"]}
];
const JOKES=["Kenapa air mata warnanya bening? Kalau hijau nanti dikira agar-agar.","Hewan apa yang paling hening? Sapi-eng (sepi).","Kenapa di kulkas ada lampu? Supaya tahu itu kulkas, bukan kamar mandi.","Gajah apa yang belalainya pendek? Gajah pesek!","Kenapa komputer suka kedinginan? Karena banyak Windows yang terbuka."];
const TEBAK=[["Bunga apa yang paling suka bohong?","Bunga bank!"],["Kenapa gajah kalau jalan kepalanya manggut-manggut?","Lagi mikir, kok berat ya jadi gajah!"],["Buah apa yang suka ngajak berantem?","Apel, karena sering bilang: ayo kita apel!"],["Kota apa yang bikin ngantuk?","Bantal... eh, Bandung. Soalnya adem!"]];
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
let idx=0,hist=[],speak=false,notif=true,busy=false,rec=null,swReg=null,pending=null,lastAct=Date.now(),lastNotif=0;
try{idx=Math.min(3,Math.max(0,+localStorage.getItem('kw-ch')||0));notif=localStorage.getItem('kw-nt')!=='0'}catch(e){}
function loadHist(){try{hist=JSON.parse(localStorage.getItem('kw-h'+idx)||'[]')}catch(e){hist=[]}}
function saveHist(){try{localStorage.setItem('kw-h'+idx,JSON.stringify(hist.slice(-40)));localStorage.setItem('kw-ch',idx)}catch(e){}}

function bubble(who,text){
  const r=document.createElement('div');r.className='row '+who;
  if(who==='bot'){const s=document.createElement('span');s.className='e';s.textContent=CH[idx].e;r.appendChild(s)}
  const m=document.createElement('div');m.className='m';m.textContent=text;r.appendChild(m);
  $('chat').appendChild(r);$('chat').scrollTop=$('chat').scrollHeight;return m;
}
function render(){
  const k=CH[idx];
  document.documentElement.style.setProperty('--c',k.c);
  $('av').textContent=k.e;$('nm').textContent=k.n;$('ds').textContent=k.d;
  $('chat').innerHTML='';bubble('bot',k.g);
  hist.forEach(h=>bubble(h.role==='user'?'user':'bot',h.content));
  [...$('tabs').children].forEach((b,i)=>b.classList.toggle('on',i===idx));
  $('nt').classList.toggle('on',notif);
}
CH.forEach((k,i)=>{const b=document.createElement('button');b.textContent=k.e+' '+k.n;b.onclick=()=>{if(busy)return;stopSpeak();idx=i;pending=null;loadHist();saveHist();render()};$('tabs').appendChild(b)});
['Jam berapa?','Tanggal berapa?','Kasih lelucon','Tebak-tebakan','Bantuan'].forEach(l=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>send(l);$('chips').appendChild(b)});

/* ===== Suara karakter ===== */
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}}
function pickVoice(){
  try{const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().replace('_','-').startsWith('id'));
  return vs.find(v=>/female|wanita|perempuan|damayanti|gadis/i.test(v.name))||vs[0]||null}catch(e){return null}
}
function say(t){
  if(!speak||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[^\p{L}\p{N}\p{P}\s]/gu,''));
  u.lang='id-ID';const v=pickVoice();if(v)u.voice=v;u.pitch=CH[idx].pi;u.rate=CH[idx].r;speechSynthesis.speak(u)}catch(e){}
}

/* ===== Notifikasi karakter di layar ===== */
let toastT=null;
function showToast(text){
  const k=CH[idx];
  $('ta').textContent=k.e;$('tn').textContent=k.n;$('tt').textContent=text;
  $('toast').classList.add('show');
  try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}
  clearTimeout(toastT);toastT=setTimeout(()=>$('toast').classList.remove('show'),7000);
  bubble('bot',text);say(text);lastNotif=Date.now();
  if(document.hidden&&swReg&&('Notification' in window)&&Notification.permission==='granted'){swReg.showNotification(k.n,{body:text,icon:'icon-192.png',badge:'icon-192.png',tag:'kawaii',vibrate:[120]}).catch(()=>{})}
}
$('toast').onclick=()=>{$('toast').classList.remove('show');$('in').focus()};
function timeNote(){
  const h=new Date().getHours();
  if(h>=5&&h<10)return"Selamat pagi! Semangat hari ini ya ☀️";
  if(h>=11&&h<14)return"Sudah waktunya makan siang, jangan dilewatkan ya 🍱";
  if(h>=21||h<4)return"Sudah malam, jangan begadang ya 🌙";
  return null;
}
function maybeNotify(first){
  if(!notif||busy)return;
  if(document.hidden&&!(('Notification' in window)&&Notification.permission==='granted'))return;
  const now=Date.now();
  if(!first&&(now-lastAct<40000||now-lastNotif<75000))return;
  showToast((Math.random()<.4&&timeNote())||pick(CH[idx].nt));
}
setInterval(()=>maybeNotify(false),20000);
setTimeout(()=>maybeNotify(true),6000);

/* ===== Fitur lokal ===== */
function calc(t){
  const s=t.replace(/,/g,'.').replace(/(\d)\s*[x×]\s*(\d)/g,'$1*$2').replace(/(\d)\s*[÷:]\s*(\d)/g,'$1/$2');
  const m=s.match(/(-?\d+(?:\.\d+)?)\s*([+\-*\/])\s*(-?\d+(?:\.\d+)?)/);if(!m)return null;
  const a=+m[1],b=+m[3];let r;
  if(m[2]==='+')r=a+b;else if(m[2]==='-')r=a-b;else if(m[2]==='*')r=a*b;else{if(b===0)return'Dibagi nol? Nggak bisa dong, nanti alam semesta ngambek 😆';r=a/b}
  return a+' '+m[2]+' '+b+' = '+(Math.round(r*1e6)/1e6)+' 🧮';
}
function local(raw){
  const t=raw.toLowerCase(),now=new Date();let r=null;
  if(pending){const p=pending;pending=null;r='Jawabannya: '+p[1]+' 😆'}
  else if((r=calc(t))){}
  else if(/\b(jam|waktu|pukul)\b/.test(t))r='Sekarang pukul '+now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}).replace('.',':')+'. Jangan lupa istirahat kalau sudah capek ✨';
  else if(/(tanggal|hari ini|hari apa)/.test(t))r='Hari ini '+now.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'. Semangat ya! 🌷';
  else if(/(lucu|canda|lelucon|jokes?)/.test(t))r=pick(JOKES)+' 😄';
  else if(t.includes('tebak')){pending=pick(TEBAK);r=pending[0]+' 🤔\n(Balas apa saja untuk lihat jawabannya)'}
  else if(/(bantuan|bisa apa|fitur)/.test(t))r='Aku bisa cek jam dan tanggal, menghitung (contoh: 12 x 5), kasih lelucon, tebak-tebakan, dan ngobrol bebas. Tekan 🎤 untuk bicara, 🔔 untuk atur notifikasi, dan ganti karakter di atas ✨';
  return r?r+pick(CH[idx].sf):null;
}

/* ===== Kirim pesan ===== */
async function send(text){
  text=(text??$('in').value).trim();
  if(!text||busy)return;
  lastAct=Date.now();$('toast').classList.remove('show');askPerm();
  $('in').value='';bubble('user',text);hist.push({role:'user',content:text});
  const lr=local(text);
  if(lr){bubble('bot',lr);hist.push({role:'assistant',content:lr});say(lr);saveHist();return}
  busy=true;$('go').disabled=true;
  const m=bubble('bot','');m.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
  try{
    const key=getKey();
    if(!key)throw {code:'nokey'};
    let msgs=hist.slice(-20).map(h=>({role:h.role,content:h.content}));
    while(msgs.length&&msgs[0].role!=='user')msgs.shift();
    const waktu=new Date().toLocaleString('id-ID',{dateStyle:'full',timeStyle:'short'});
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-5-5',max_tokens:500,system:BASE+CH[idx].p+' Sekarang: '+waktu+'.',messages:msgs})});
    const j=await res.json();
    if(!res.ok)throw {code:res.status,message:j.error&&j.error.message};
    const t=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    m.textContent=t;hist.push({role:'assistant',content:t});say(t);
  }catch(e){
    hist.pop();
    const c=e&&e.code;
    m.textContent=c==='nokey'?'Untuk ngobrol bebas, masukkan kunci API dulu lewat tombol 🔑. Jam, tanggal, hitung, lelucon, dan tebak-tebakan tetap bisa dipakai tanpa kunci 😊':c===401?'Kunci API-nya sepertinya salah. Cek lagi lewat tombol 🔑 ya. 🐾':c===429?'Pelan-pelan dulu ya, tunggu sebentar lalu coba lagi. 🐾':(e instanceof TypeError)?'Sepertinya tidak ada internet. Coba lagi nanti ya. 🐾':'Duh, ada kendala: '+((e&&e.message)||'tidak diketahui')+' 🐾';
    if(c==='nokey')setTimeout(()=>{try{$('dlg').showModal()}catch(x){}},400);
  }
  saveHist();busy=false;$('go').disabled=false;lastAct=Date.now();
}

$('go').onclick=()=>send();
$('in').addEventListener('keydown',e=>{lastAct=Date.now();if(e.key==='Enter')send()});
$('clr').onclick=()=>{if(busy)return;stopSpeak();hist=[];pending=null;saveHist();render()};
$('spk').onclick=function(){speak=!speak;this.classList.toggle('on',speak);this.textContent=speak?'🔊':'🔈';if(speak){say('Halo! Suaraku sudah aktif ya')}else stopSpeak()};
$('nt').onclick=function(){notif=!notif;this.classList.toggle('on',notif);try{localStorage.setItem('kw-nt',notif?'1':'0')}catch(e){}if(!notif)$('toast').classList.remove('show');else{askPerm();showToast(pick(CH[idx].nt))}};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('mic').onclick=function(){
  const tip='Mikrofon tidak bisa dipakai di sini. Coba tombol 🎤 di papan ketik HP kamu untuk bicara. 🐾';
  if(!SR){bubble('bot',tip);return}
  if(rec){rec.stop();return}
  try{
    rec=new SR();rec.lang='id-ID';rec.interimResults=false;
    rec.onstart=()=>this.classList.add('rec');
    rec.onresult=e=>{speak=true;$('spk').classList.add('on');$('spk').textContent='🔊';send(e.results[0][0].transcript)};
    rec.onerror=()=>bubble('bot',tip);
    rec.onend=()=>{this.classList.remove('rec');rec=null};
    rec.start();
  }catch(e){rec=null;bubble('bot',tip)}
};
function getKey(){try{return localStorage.getItem('kw-key')||''}catch(e){return''}}
function askPerm(){try{if(notif&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}
$('key').onclick=()=>{$('kin').value=getKey();$('dlg').showModal()};
$('ksv').onclick=()=>{try{localStorage.setItem('kw-key',$('kin').value.trim())}catch(e){}$('dlg').close()};
$('kcl').onclick=()=>$('dlg').close();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(r=>{swReg=r}).catch(()=>{});
loadHist();render();
</script>
</body>
</html>
